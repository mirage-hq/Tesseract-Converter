name: Rust CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conv-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          toolchain: '1.92.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release archive and CI policy unit tests
        run: |
          make test-release-archive
          python3 scripts/test-conversion-ci.py
      - name: Check public source boundaries and crates.io publication policy
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 scripts/audit-dependency-boundary.py --metadata "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          for entry in subprocess.check_output(['git', 'ls-files', '--stage', '-z']).split(b'\0'):
              assert not entry.startswith(b'120000 '), f'symlink in public source: {entry!r}'
          metadata = json.loads(Path(sys.argv[1]).read_text())
          root = Path.cwd()
          local = {p['name']: p.get('publish') for p in metadata['packages']
                   if Path(p['manifest_path']).is_relative_to(root)}
          names = {'tsrct-conv', 'media_transcode', 'aftereffects_file', 'premiere_file', 'fx_conv',
                   'fx_keyframe_bake', 'tesseract_file', 'fx_schema'}
          assert local == {name: [] for name in names}, f'crates.io publication is not disabled: {local}'
          PY
      - name: Build pinned inspection libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config nasm zlib1g-dev clang libclang-dev
          prefix="$PWD/target/ci-ffmpeg"
          python3 scripts/ffmpeg.py "$prefix"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Format
        run: make fmt
      - name: Clippy
        run: make clippy
      - name: Rust tests
        run: make test
  platform-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          toolchain: '1.92.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up MSVC compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install MSYS2 build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils patch nasm
      - name: Build pinned inspection libraries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$(dirname "$(which cl)"):$PATH"
          prefix="$(cygpath -w "$PWD/target/ci-ffmpeg")"
          python scripts/ffmpeg.py "$prefix"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$prefix\\include" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          echo "$prefix\\bin" >> "$GITHUB_PATH"
      - name: Build pinned inspection libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$PWD/target/ci-ffmpeg"
          python3 scripts/ffmpeg.py "$prefix"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Build and smoke CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" = Windows ]]; then export PATH="$(dirname "$(command -v cl)"):$PATH"; fi
          cargo build --locked -p tsrct-conv
          binary=target/debug/tsrct-conv
          if [[ "$RUNNER_OS" = Windows ]]; then binary+=.exe; fi
          "$binary" --version
          "$binary" --help >/dev/null
