[package]
name = "aftereffects_file"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["ffmpeg-library"]
ffmpeg-library = ["media_transcode/ffmpeg-library"]

[dependencies]
fx_conv = { path = "../fx_conv" }
tesseract_file = { path = "../tesseract_file" }
tempfile = "3"
fx_schema = { path = "../fx_schema" }
fx_keyframe_bake = { path = "../fx_keyframe_bake" }
lopdf = { version = "0.45.0", default-features = false }
boa_engine = { version = "0.21.1", default-features = false, features = ["js"] }
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
image.workspace = true
media_transcode = { path = "../media_transcode", default-features = false }

[dev-dependencies]
base64.workspace = true
roxmltree.workspace = true
flate2 = "1"
