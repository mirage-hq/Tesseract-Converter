[package]
name = "media_transcode"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Explicit media preparation orchestration for tsrct-conv"

[features]
default = []
ffmpeg-library = ["dep:ffmpeg-next"]

[dependencies]
ffmpeg-next = { version = "8", optional = true }
fx_conv = { path = "../fx_conv" }
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
