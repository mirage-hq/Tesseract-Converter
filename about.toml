# Release dependency selection: prefer permissive alternatives where available.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "MPL-2.0", "WTFPL", "Zlib", "0BSD", "Unlicense", "BSL-1.0", "LGPL-2.1-or-later"]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The crate manifest offers MIT/Apache-2.0, but its bundled C also contains
# NVIDIA's Apache-2.0 additions. Generic SPDX fallback drops the actual native
# copyright notices. Pin representative headers for every distinct holder/year.
[gdeflate-sys.clarify]
license = "MIT AND Apache-2.0"

